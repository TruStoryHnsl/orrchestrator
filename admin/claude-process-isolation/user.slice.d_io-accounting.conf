# Drop-in override for user.slice to enable IO accounting.
# File path destination: ~/.config/systemd/user/user.slice.d/io-accounting.conf
#
# CRITICAL: By default, user.slice has IOAccounting=no, which silently disables
# IO weighting for ALL children, including orrch.slice. This drop-in enables
# IO accounting at the user.slice level so that child slices (orrch.slice,
# claude-limit.slice) can enforce their IO weight limits.
#
# Without this, orrch-spawn children can chew 19 GB/s IO uncontrolled,
# rendering the terminal unresponsive.

[Slice]
IOAccounting=yes
CPUAccounting=yes
MemoryAccounting=yes
TasksAccounting=yes

# Drop-in override for claude-limit.slice.
# Hardens resource accounting and IO/CPU weighting to match orrch.slice
# constraints. File path destination: ~/.config/systemd/user/claude-limit.slice.d/override.conf

[Slice]
CPUWeight=20
IOWeight=20
CPUAccounting=yes
IOAccounting=yes
MemoryAccounting=yes
TasksAccounting=yes
MemoryHigh=4G
MemoryMax=8G
TasksMax=2048
